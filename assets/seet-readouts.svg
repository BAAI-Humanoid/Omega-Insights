<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="740" viewBox="0 0 1050 740" role="img" aria-labelledby="title desc">
<title id="title">SEET：共享视觉主干，两种不同读出</title><desc id="desc">SEET进行中的架构设计以多视角RGB、当前本体状态和上一帧动作为条件，使用FLUX.2 Klein 4B共享视觉主干及LoRA和触觉监督。触点图潜在表示用于生成触点标记图；手指查询特征通过数值头读出接触概率和力。数值分支不依赖触点图生成。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#526b60"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183c31}.line{fill:none;stroke:#526b60;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}.small{font-size:18px;fill:#526b60}.body{font-size:21px}.heading{font-size:25px;font-weight:600}</style></defs>
<rect width="1050" height="740" fill="#fafbf7"/>
<text x="36" y="44" font-size="15" style="fill:#155c4e" font-weight="600">SEET / VISUAL TACTILE ESTIMATION</text>
<text x="36" y="85" font-size="29" font-weight="600">共享视觉主干，分别读出可视化与数值结果</text>
<text x="36" y="121" font-size="20" style="fill:#b95632" font-weight="600">进行中的架构设计 · 聚焦当前接触估计</text>
<rect x="36" y="204" width="228" height="292" rx="8" fill="#fff" stroke="#c6d2c7"/>
<text x="56" y="245" font-size="24" font-weight="600">视觉与交互条件</text>
<text x="56" y="291" font-size="22">多视角 RGB</text>
<text x="56" y="329" font-size="22">当前本体状态</text>
<text x="56" y="367" font-size="22">上一帧动作</text>
<path d="M264 350 H303" class="line"/>
<rect x="307" y="204" width="295" height="292" rx="8" fill="#155c4e" stroke="#155c4e"/>
<text x="328" y="245" font-size="25" style="fill:#fff" font-weight="600">FLUX.2 Klein 4B</text>
<text x="328" y="280" font-size="21" style="fill:#e4eee5">共享视觉主干</text>
<path d="M328 303 H580" stroke="#75a396"/>
<text x="328" y="337" font-size="20" style="fill:#fff">视觉 token</text>
<text x="328" y="369" font-size="20" style="fill:#fff">触点图 latent</text>
<text x="328" y="401" font-size="20" style="fill:#fff">手指查询</text>
<text x="328" y="459" font-size="18" style="fill:#e4eee5">LoRA 适配 + 触觉监督</text>
<path d="M602 350 H632 V267 H663" class="line"/>
<path d="M632 350 V469 H663" class="line"/>
<rect x="667" y="171" width="347" height="191" rx="8" fill="#eef2ec" stroke="#c6d2c7"/>
<text x="688" y="207" font-size="15" style="fill:#155c4e" font-weight="600">A / 生成式读出</text>
<text x="688" y="247" font-size="22">触点图 latent</text>
<text x="688" y="281" font-size="22">→ 生成式图像读出</text>
<text x="688" y="315" font-size="22">→ 图像中的触点标记</text>
<rect x="667" y="389" width="347" height="211" rx="8" fill="#f5eee4" stroke="#d8c5ae"/>
<text x="688" y="425" font-size="15" style="fill:#b95632" font-weight="600">B / 数值读出</text>
<text x="688" y="465" font-size="22">手指查询特征</text>
<text x="688" y="499" font-size="22">→ 数值头</text>
<text x="688" y="533" font-size="22">→ 接触概率与触觉力</text>
<text x="688" y="576" font-size="18" style="fill:#526b60">一次前向读出数值</text>
<rect x="36" y="632" width="978" height="73" rx="8" fill="#eef2ec" stroke="#c6d2c7"/>
<text x="58" y="663" font-size="23" font-weight="600">数值分支直接读取特征，无需等待触点图生成，也不从生成图反推力。</text>
<text x="58" y="689" font-size="17" style="fill:#526b60">本图说明架构设计，不代表已经验证推理速度或跨本体泛化能力。</text>
</svg>
