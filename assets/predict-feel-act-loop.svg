<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="690" viewBox="0 0 1050 690" role="img" aria-labelledby="title desc">
<title id="title">Predict. Feel. Act.：物理交互研究框架</title><desc id="desc">EVA研究动作条件化的潜在后果预测与动作修正；SEET在触觉监督下从视觉与交互上下文估计接触；DECO使用真实触觉反馈适配双臂策略。虚线表示研究方向中的联系，不表示已经完成三者联合部署。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#526b60"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183c31}.line{fill:none;stroke:#526b60;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}.small{font-size:18px;fill:#526b60}.body{font-size:21px}.heading{font-size:25px;font-weight:600}</style></defs>
<rect width="1050" height="690" fill="#fafbf7"/>
<text x="36" y="44" font-size="15" style="fill:#155c4e" font-weight="600">PREDICT · FEEL · ACT</text>
<text x="36" y="85" font-size="30" font-weight="600">让后果、接触与行动围绕同一个任务</text>
<text x="36" y="121" font-size="20" style="fill:#b95632" font-weight="600">研究框架 · 协同闭环仍在推进</text>
<rect x="36" y="161" width="314" height="309" rx="8" fill="#eef2ec" stroke="#c6d2c7"/>
<text x="56" y="194" font-size="15" style="fill:#155c4e" font-weight="600">01 / PREDICT</text>
<text x="56" y="235" font-size="29" font-weight="600">ω-EVA</text>
<text x="56" y="281" font-size="21">当前观测 + 候选动作</text>
<text x="56" y="316" font-size="21">→ 潜在未来后果</text>
<text x="56" y="351" font-size="21">→ 动作修正</text>
<path d="M56 373 H330" stroke="#d4ddd1"/>
<text x="56" y="408" font-size="18" style="fill:#526b60">在执行之前，</text>
<text x="56" y="436" font-size="18" style="fill:#526b60">让预期后果参与动作生成。</text>
<path d="M193 470 V519" class="line dash" marker-start="url(#arrow)"/>
<rect x="368" y="161" width="314" height="309" rx="8" fill="#fff" stroke="#c6d2c7"/>
<text x="388" y="194" font-size="15" style="fill:#155c4e" font-weight="600">02 / FEEL</text>
<text x="388" y="235" font-size="29" font-weight="600">ω-SEET</text>
<text x="388" y="281" font-size="21">视觉 + 交互上下文</text>
<text x="388" y="316" font-size="21">→ 接触表征</text>
<text x="388" y="351" font-size="21">真实触觉提供监督</text>
<path d="M388 373 H662" stroke="#d4ddd1"/>
<text x="388" y="408" font-size="18" style="fill:#526b60">学习可复用的接触线索</text>
<text x="388" y="436" font-size="18" style="fill:#526b60">触觉估计研究进行中</text>
<path d="M525 470 V519" class="line dash" marker-start="url(#arrow)"/>
<rect x="700" y="161" width="314" height="309" rx="8" fill="#fff" stroke="#c6d2c7"/>
<text x="720" y="194" font-size="15" style="fill:#155c4e" font-weight="600">03 / FEEL → ACT</text>
<text x="720" y="235" font-size="29" font-weight="600">DECO</text>
<text x="720" y="281" font-size="21">视觉 + 真实触觉</text>
<text x="720" y="316" font-size="21">→ 轻量触觉适配</text>
<text x="720" y="351" font-size="21">→ 双臂动作策略</text>
<path d="M720 373 H994" stroke="#d4ddd1"/>
<text x="720" y="408" font-size="18" style="fill:#526b60">让测得的接触状态</text>
<text x="720" y="436" font-size="18" style="fill:#526b60">真正进入动作策略。</text>
<path d="M857 470 V519" class="line dash" marker-start="url(#arrow)"/>
<rect x="36" y="523" width="978" height="93" rx="8" fill="#f5eee4" stroke="#d8c5ae"/>
<text x="60" y="560" font-size="23" font-weight="600">真实物理交互 · 视觉、本体与触觉反馈，以及动作和任务结果</text>
<text x="60" y="593" font-size="19" style="fill:#526b60">持续观察偏差，让真实经验进入下一次预测、估计与行动。</text>
<text x="36" y="651" font-size="18" style="fill:#526b60">虚线表示研究方向中的联系，不代表三项工作已经组成统一部署的系统。</text>
</svg>
